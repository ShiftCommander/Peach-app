name: Apply Peach icon assets

on:
  push:
    branches:
      - feat/new-peach-app-icon
    paths:
      - .icon-staging/ready

permissions:
  contents: write

jobs:
  apply-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out icon branch
        uses: actions/checkout@v4
        with:
          ref: feat/new-peach-app-icon
          fetch-depth: 0

      - name: Download Drive-sourced PNG assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-b950-8246-8284-001034f03b22/raw?se=2026-07-31T07:28:41Z&sp=r&sv=2026-02-06&sr=b&scid=d7235127-cae6-5e00-9ff2-a4daf6fc6488&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T05:49:51Z&ske=2026-08-02T05:49:51Z&sks=b&skv=2026-02-06&sig=bVhIrwTn%2B1UgnhIaeWh2Ey4cAeJV6OF25uezfbGb9iw%3D' -o icons/favicon-32.png
          curl -fsSL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-9660-81f4-b897-3a9427ae4901/raw?se=2026-07-31T07:28:24Z&sp=r&sv=2026-02-06&sr=b&scid=ba595599-83f2-5dcb-88ef-282bde30cadb&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T05:49:48Z&ske=2026-08-02T05:49:48Z&sks=b&skv=2026-02-06&sig=wqgKxRz/YzWkIvss%2BouvdmNiQzdtwpZJ01BdA9bmDyQ%3D' -o icons/apple-touch-icon.png
          curl -fsSL --retry 3 'https://sdmntprukwest.oaiusercontent.com/files/00000000-7af4-8243-a11d-b22f07ca5a4f/raw?se=2026-07-31T07:28:49Z&sp=r&sv=2026-02-06&sr=b&scid=4b76a33a-abf4-5765-96d5-da41c3176a0f&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T06:57:50Z&ske=2026-08-02T06:57:50Z&sks=b&skv=2026-02-06&sig=0LthFbPI0dc%2B3wSCSmHrm4eShpnMYSJBc8gzHSGgqr8%3D' -o icons/icon-192.png
          curl -fsSL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-d40c-81f4-9b6b-1e4d3ba17b6c/raw?se=2026-07-31T07:28:59Z&sp=r&sv=2026-02-06&sr=b&scid=176637b3-9870-58cb-9baf-9b6902eb07f3&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T05:49:48Z&ske=2026-08-02T05:49:48Z&sks=b&skv=2026-02-06&sig=7Lokjm%2BDwkFcx3lSszUeTw9pHdz%2BYZ18mTVrf1prhxk%3D' -o icons/icon-512.png
          curl -fsSL --retry 3 'https://sdmntprukwest.oaiusercontent.com/files/00000000-3ef8-8243-bf79-058399636950/raw?se=2026-07-31T07:29:13Z&sp=r&sv=2026-02-06&sr=b&scid=0f830f5c-d94b-5363-93fc-f0e52009283b&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T02:12:22Z&ske=2026-08-02T02:12:22Z&sks=b&skv=2026-02-06&sig=x8XFKg0VERlnb6BBNNamWoxBikmjAtjCTCSohJrfmRU%3D' -o icons/maskable-icon-192.png
          curl -fsSL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-9788-81f4-92d8-b8374d33cd84/raw?se=2026-07-31T07:29:25Z&sp=r&sv=2026-02-06&sr=b&scid=767f2497-38e0-540b-902a-cb711d10497c&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T02:14:16Z&ske=2026-08-02T02:14:16Z&sks=b&skv=2026-02-06&sig=iG0GmWXkzHkS8ze6Dhzti1vnwxHLehTd1ZXofCbh6Pw%3D' -o icons/maskable-icon-512.png

      - name: Verify exact Git blob hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object icons/favicon-32.png)" = "45655db379655fdca4f46596873e1271add8836f"
          test "$(git hash-object icons/apple-touch-icon.png)" = "b245f22c43e0b62c1f50877773164cd5d5f9fd1c"
          test "$(git hash-object icons/icon-192.png)" = "a5360e373172765968f073bfb2a2f1b985dfd030"
          test "$(git hash-object icons/icon-512.png)" = "f810b77ffc543323f16e2055472395b72c777d6b"
          test "$(git hash-object icons/maskable-icon-192.png)" = "e10fa07e379103ae94a23f6000cbda18918f1108"
          test "$(git hash-object icons/maskable-icon-512.png)" = "5f02c38bf327c3133db1ef09e8c9d48d59f9de09"

      - name: Commit restored binary assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .icon-staging
          rm -f .github/workflows/apply-icon-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A icons .icon-staging .github/workflows/apply-icon-assets.yml
          git commit -m "fix: restore Peach icon PNG assets"
          git push origin HEAD:feat/new-peach-app-icon
