name: Import final Peach icon assets

on:
  push:
    branches:
      - fix/maskable-safe-zone-assets

permissions:
  contents: write

jobs:
  import-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maskable-safe-zone-assets
      - name: Download validated assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p icons
          curl --fail --location --retry 3 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-a810-820a-abb7-0076cc758afe/raw?se=2026-08-02T15:37:11Z&sp=r&sv=2026-02-06&sr=b&scid=4dea4042-4f58-5f6f-a889-f4f80ea5bba4&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T07:37:02Z&ske=2026-08-03T07:37:02Z&sks=b&skv=2026-02-06&sig=CYRZaQFv7gLtHUm%2BFR5msRXp1HTBh1772YsJNt6SQTk%3D' --output icons/favicon-32.png
          curl --fail --location --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-f1e0-81f4-89e2-633d92ae671b/raw?se=2026-08-02T15:37:25Z&sp=r&sv=2026-02-06&sr=b&scid=ae232589-09b1-5838-a74e-7ce6c2e336bd&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T06:19:00Z&ske=2026-08-03T06:19:00Z&sks=b&skv=2026-02-06&sig=aIYiVY7mkk%2BTyRk68TQDHyf1GOC9krBFog%2BQQRlTBDQ%3D' --output icons/apple-touch-icon.png
          curl --fail --location --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-94c8-81f4-959b-6a98aee778f1/raw?se=2026-08-02T15:37:39Z&sp=r&sv=2026-02-06&sr=b&scid=85e3474e-5951-5737-83d2-659ef3a8ad51&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T05:03:04Z&ske=2026-08-03T05:03:04Z&sks=b&skv=2026-02-06&sig=/i3ca84AUt1BR8PEVUwGA9V8ASkQBZ3HqEfqqPmo%2BAU%3D' --output icons/icon-192.png
          curl --fail --location --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-6cf0-81f4-bc6e-641336a58259/raw?se=2026-08-02T15:37:55Z&sp=r&sv=2026-02-06&sr=b&scid=5e587902-195f-5c60-b86e-bb12f3737544&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T05:53:37Z&ske=2026-08-03T05:53:37Z&sks=b&skv=2026-02-06&sig=ixTdG9oOnkAzoT5/xdIhR7IrEkshYNPZtWpxsRmDtgE%3D' --output icons/icon-512.png
          curl --fail --location --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-22b8-81f4-92fb-0b3513c978de/raw?se=2026-08-02T15:38:30Z&sp=r&sv=2026-02-06&sr=b&scid=48e72352-d2eb-5d0e-aa29-9270fc403f2c&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T07:37:02Z&ske=2026-08-03T07:37:02Z&sks=b&skv=2026-02-06&sig=mfKPGB6WY9AHR1J8P0eZPGZ4jDKX2qSzO0CAD8nl9PA%3D' --output icons/maskable-icon-192.png
          curl --fail --location --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-7e00-81f4-9ee9-48e7ca6574a5/raw?se=2026-08-02T15:38:41Z&sp=r&sv=2026-02-06&sr=b&scid=771c12d2-b11e-5e00-a875-f9eb832bf99e&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T06:18:32Z&ske=2026-08-03T06:18:32Z&sks=b&skv=2026-02-06&sig=NQzaUY/rntz/BxdXKRox/cL%2BiL66UNhKOPc4BORk5tE%3D' --output icons/maskable-icon-512.png
          sha256sum --check <<'SHA256'
          aad74960741830ed7b4b5e5553e174e84492c6909312e2536dede74b0b8a00ff  icons/favicon-32.png
          3d9f9a9e320b4dd55553d1e713597f8f5995fcf0964bcd49e220923940e95901  icons/apple-touch-icon.png
          5aaabd7d71a801d9b510bea58afa4cb1e3f6cdd359019e1d3833ccb97ea340b5  icons/icon-192.png
          f6ed83fe92d9d96fbabf6c41b29d630437c09d8571f8c396200a611d5115228d  icons/icon-512.png
          1ebaf454fbb81ba278b9e530d53ba5e037a1e750b4f53f71d3178f44dc91d6db  icons/maskable-icon-192.png
          590b175ceb057d079a52eedc11ce156f9bd86e55a788e3bbe8199b905dac1918  icons/maskable-icon-512.png
          SHA256
      - name: Commit binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/*.png
          git diff --cached --quiet && exit 0
          git commit -m 'fix: add platform-safe Peach icon exports'
          git push origin HEAD:fix/maskable-safe-zone-assets
