name: Import full-bleed Peach maskable icons

on:
  push:
    branches:
      - fix/full-bleed-maskable-icons

permissions:
  contents: write

jobs:
  import-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-bleed-maskable-icons
      - name: Download full-bleed maskable assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-bf88-8209-b216-cb9e40845d0d/raw?se=2026-08-02T22:06:40Z&sp=r&sv=2026-02-06&sr=b&scid=85c5c6d0-0ca4-56ee-89c6-973c89c07b8e&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T21:57:23Z&ske=2026-08-03T21:57:23Z&sks=b&skv=2026-02-06&sig=D/dXrp2t3SesZsHKAKG0eL%2BDRYPScYBTq8UhQBwgKb4%3D' --output icons/maskable-icon-192.png
          curl --fail --location --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-7054-81f4-8acf-95942af64d36/raw?se=2026-08-02T22:07:05Z&sp=r&sv=2026-02-06&sr=b&scid=9ff147e9-74a2-501b-8684-b0f19509d876&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T21:48:58Z&ske=2026-08-03T21:48:58Z&sks=b&skv=2026-02-06&sig=I2Tc8KtHQNTzaDQODttyksuxqk0ZmyY1xjZ%2BDcdyQ6o%3D' --output icons/maskable-icon-512.png
          sha256sum --check <<'SHA256'
          fa5770118d3d7811ddb9e7387acb1d464a66911132894ae8d3b3706c49f2727d  icons/maskable-icon-192.png
          66b757ebd68e9e137928ae0ee64e07f9a163385306fa3dee78fd541c80b26bf7  icons/maskable-icon-512.png
          SHA256
      - name: Commit assets and remove importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/import-full-bleed-icons.yml
          git add icons/maskable-icon-192.png icons/maskable-icon-512.png .github/workflows/import-full-bleed-icons.yml
          git commit -m 'fix: make Android maskable icons full bleed'
          git push origin HEAD:fix/full-bleed-maskable-icons
