name: Import full-bleed Peach Android icons

on:
  push:
    branches:
      - fix/android-icon-full-bleed-refresh

permissions:
  contents: write

jobs:
  import-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-icon-full-bleed-refresh
      - name: Download approved full-bleed assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-9e88-81f5-84b3-61e02f23e2ac/raw?se=2026-09-21T16%3A01%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=2ec2da9f-1a66-52f5-878b-426d1f8e24ac&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T09%3A14%3A08Z&ske=2026-09-22T09%3A14%3A08Z&sks=b&skv=2026-02-06&sig=EKNzrHiyRV3HiuaQCH22C7ipn8UyUUlr9QwPRbD5bxA%3D' --output icons/maskable-icon-192.png
          curl --fail --location --retry 3 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-b034-81f6-8f95-53c1538929a8/raw?se=2026-09-21T16%3A01%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=b433db04-716f-5d08-b878-e1d5c30c4ad1&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T06%3A55%3A09Z&ske=2026-09-22T06%3A55%3A09Z&sks=b&skv=2026-02-06&sig=MhjalgxJbRKIBN7Qo25JnDtw8rZBH8PjiSe%2BJoymNgk%3D' --output icons/maskable-icon-512.png
          sha256sum --check <<'SHA256'
          fa5770118d3d7811ddb9e7387acb1d464a66911132894ae8d3b3706c49f2727d  icons/maskable-icon-192.png
          66b757ebd68e9e137928ae0ee64e07f9a163385306fa3dee78fd541c80b26bf7  icons/maskable-icon-512.png
          SHA256
      - name: Commit binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/maskable-icon-192.png icons/maskable-icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore full-bleed Android icon assets'
          git push origin HEAD:fix/android-icon-full-bleed-refresh
